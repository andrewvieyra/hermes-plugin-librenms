name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # requests for the tests of the real session against a local server; PyYAML for the one test that checks
      # the manifest reader every other manifest test uses against a real YAML parser
      - run: pip install -r requirements.txt pyyaml
      - name: Unit tests (fake LibreNMS, no network)
        run: python -m unittest discover -s tests -t . -v

  coverage:
    # Branch coverage on one Python; settings in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install coverage pyyaml -r requirements.txt  # only the real-loader tests skip (hermes-loader runs them)
      - name: Unit tests under coverage
        run: make coverage PY=python

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  hermes-loader:
    # Loads the plugin through Hermes' real PluginManager and runs the catalog's admission checks.
    # Best-effort: Hermes moves fast.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # hermes-agent's pyproject declares its dependencies for Python 3.14 only (its own installs use uv.lock),
          # so `pip install -e` on an older Python leaves out ruamel.yaml and the loader cannot import.
          python-version: "3.14"
      - name: Fetch hermes-agent
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
      - name: Install hermes-agent requirements
        run: pip install -e /tmp/hermes-agent
      - name: Loader test
        env:
          HERMES_AGENT_ROOT: /tmp/hermes-agent
        run: python -m unittest tests.test_plugin_load -v
      - name: hermes plugins validate
        run: hermes plugins validate .
