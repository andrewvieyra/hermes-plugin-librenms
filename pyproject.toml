# Hermes loads this directory as a plugin; it is not published to PyPI. The [project] table exists because
# Hermes' package manager reads dependencies from a pyproject.toml next to plugin.yaml in preference to the
# manifest's python_dependencies, so both must agree. The rest is tool configuration for ruff and coverage.

[project]
name = "hermes-plugin-librenms"
version = "0.10.1"
description = "LibreNMS for Hermes Agent: reviewed plans, journaled apply, rollback and an audit trail"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["requests>=2.32.4,<3"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905", "UP007", "UP035", "UP006", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_plugins"]

[tool.ruff.format]
quote-style = "double"

# `make coverage` and CI: branch coverage of the plugin's own modules.
[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
