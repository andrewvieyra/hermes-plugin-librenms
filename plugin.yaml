name: librenms
version: 0.11.1
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.3"
description: "LibreNMS change management for Hermes: query devices, ports, alerts and logs, answer questions about the network over a conversation, build a plan with a field-level diff, apply it with a journal, and roll back. Nothing is written without a reviewed plan."
author: Andrew Vieyra
license: MIT
homepage: https://github.com/andrewvieyra/hermes-plugin-librenms
tags: [librenms, monitoring, snmp, nms, infrastructure, change-management]
kind: standalone
requires_env:
  - name: LIBRENMS_URL
    description: "Base URL of the LibreNMS instance, e.g. https://librenms.example.com (a trailing /api/v0 is stripped)"
    secret: false
  - name: LIBRENMS_TOKEN
    description: "LibreNMS API token, sent only in the X-Auth-Token header. It carries every right of its user: use a dedicated user with the least role that does the job."
    url: "https://docs.librenms.org/API/"
    secret: true
optional_env:
  - LIBRENMS_VERIFY_SSL
  - LIBRENMS_TIMEOUT
  - LIBRENMS_PROXY
provides_tools:
  - librenms_query
  - librenms_report
  - librenms_plan
  - librenms_apply
  - librenms_rollback
  - librenms_plans
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_approval_response
python_dependencies:
  - "requests>=2.32.4,<3"
config_schema:
  write_mode:
    type: str
    default: full
    choices: [full, operator_only, read_only]
    description: "full: the model may apply and roll back after the user says yes (and Hermes' approval prompt, with require_approval). operator_only: only /librenms and `hermes librenms` from your own terminal may apply or roll back; model calls are refused with the command to relay. read_only: no writes; the apply and rollback tools are hidden. Any other value is read_only."
  require_approval:
    type: bool
    default: true
    description: "In full mode, send every librenms_apply and librenms_rollback call to Hermes' approval prompt with the plan summary, one approval key per plan, choice and plan content (an answer never covers the plan once its file changes), and block `hermes librenms apply|rollback` run through the agent's terminal. Unattended runs follow Hermes' own approval policy (approvals.cron_mode, unattended_mode, single_query_mode)."
  allow_delete:
    type: bool
    default: false
    description: "Allow delete operations in plans. Off by default: deleting a device removes its history and cannot be undone, and rollback of any other delete re-creates the object with a new id."
  allow_device_add:
    type: bool
    default: false
    description: "Allow device create, and device updates that change hostname or overwrite_ip. Off by default: LibreNMS then probes a host the model chose over ICMP and SNMP, with the credentials it is given or its configured defaults."
  allow_services:
    type: bool
    default: false
    description: "Allow service operations. Off by default: a service runs a Nagios check plugin on the poller with the parameters the model writes."
  allow_insecure_transport:
    type: bool
    default: false
    description: "Permit an http:// LIBRENMS_URL, LIBRENMS_VERIFY_SSL=false, and audit sinks over plain or unverified transports. Off by default: the token and audit events would cross the network readable or to an unverified peer."
  max_operations:
    type: int
    default: 100
    description: "Maximum operations accepted in one plan (at most 1000)."
  max_query_results:
    type: int
    default: 500
    description: "Maximum rows librenms_query or librenms_report returns in one call (at most 5000); the rest are read with offset."
  max_result_chars:
    type: int
    default: 60000
    description: "Most characters one tool result for the model may take (8000 to 90000). Past Hermes' per-result threshold (100,000 characters, 15% of the context window in characters on a smaller model) Hermes shows the model only a 1,500-character preview, so rows past the budget are left out and said to be, and plans are shown a range of steps at a time. On a model with a context window under 100K tokens, lower it to half the window's token count (64K tokens: 32000)."
  librenms_timezone:
    type: str
    default: ""
    description: "The IANA time zone LibreNMS runs in (its PHP date.timezone), e.g. Europe/Amsterdam. LibreNMS writes fault, alert-log, eventlog, syslog, authlog and billing times in that zone without saying which, and no API field names it. Every librenms_report result names this zone (timezone), or says it is unknown while this is empty; the views that show fault, log and billing times (alerts, alert_history, the port view's open faults, events, a bill's last calculation) read them in it, and give them no age without it (alert_history and events then read their window from a bound early enough for any zone, and refuse today). Every other time a report shows (device times in ISO UTC, outages and port polls in unix seconds, uptimes, the age of a port's last change) is exact either way. A name this host's zone database does not hold is refused."
  max_plan_age_hours:
    type: int
    default: 24
    description: "Plans older than this are refused by apply; re-plan instead (at most 720)."
  max_maintenance_hours:
    type: int
    default: 72
    description: "Longest maintenance window a plan may schedule (at most 8760). LibreNMS' API cannot end a window early, so the window is the undo."
  plan_retention_days:
    type: int
    default: 90
    description: "Delete plan files older than this many days (plans being applied or rolled back are kept). 0 keeps plans forever. Checked at most hourly per profile, when a plan is made or listed, on status and on every /librenms or hermes librenms command; for a strict policy run `hermes librenms prune` from cron."
  audit_log:
    type: bool
    default: true
    description: "Append one JSON line per plan, apply, rollback, approval and refusal event to the audit log (SIEM-friendly)."
  audit_log_path:
    type: str
    default: ""
    description: "Audit log file, as an absolute path (~ is expanded; a relative one is refused and the default used). It must be a regular file owned by the account Hermes runs as and have no other hard link, and is never written through a symlink. Empty means <HERMES_HOME>/plugin-data/librenms/audit.jsonl."
  audit_include_request:
    type: bool
    default: true
    description: "Record the user's triggering message (secrets masked, truncated to 500 characters) in the actor record."
  link_eventlog:
    type: bool
    default: true
    description: "After apply and rollback, read LibreNMS' eventlog for the devices the plan touched and store the new event ids in the journal."
  audit_sinks:
    type: list
    default: []
    description: "Forward audit events to syslog (udp/tcp/tls, json or CEF) and/or an HTTP collector (json or Splunk HEC). Put a collector token in .env and write it as ${NAME} in a header, never as a literal. Once the list holds a ${NAME}, edit it in config.yaml: the Desktop's form shows it with each ${NAME} replaced by its value and saves it that way. See docs/sinks.md."
  audit_sink_secret:
    type: secret
    env: LIBRENMS_AUDIT_SINK_SECRET
    description: "A collector token for an HTTP audit sink, kept in the profile's .env (never config.yaml). Write ${LIBRENMS_AUDIT_SINK_SECRET} where audit_sinks needs it, e.g. headers: {Authorization: \"Splunk ${LIBRENMS_AUDIT_SINK_SECRET}\"}, and make later changes to audit_sinks in config.yaml: the Desktop's form shows and saves it with the token in the placeholder's place."
